spring.application.name=config-server
server.port=${CONFIG_SERVER_PORT:8888}
server.address=${CONFIG_SERVER_BIND_ADDRESS:127.0.0.1}

# Remote Git only. All values are loaded from the project-root .env file.
spring.cloud.config.server.git.uri=${KARTYAVYA_CONFIG_REPO_URI}
spring.cloud.config.server.git.default-label=${KARTYAVYA_CONFIG_REPO_DEFAULT_LABEL:main}
spring.cloud.config.server.git.clone-on-start=${KARTYAVYA_CONFIG_REPO_CLONE_ON_START:true}
spring.cloud.config.server.git.force-pull=${KARTYAVYA_CONFIG_REPO_FORCE_PULL:true}
spring.cloud.config.server.git.delete-untracked-branches=${KARTYAVYA_CONFIG_REPO_DELETE_UNTRACKED_BRANCHES:true}
spring.cloud.config.server.git.refresh-rate=${KARTYAVYA_CONFIG_REPO_REFRESH_RATE:30}
spring.cloud.config.server.git.timeout=${KARTYAVYA_CONFIG_REPO_TIMEOUT_SECONDS:20}
spring.cloud.config.server.git.try-master-branch=${KARTYAVYA_CONFIG_REPO_TRY_MASTER_BRANCH:false}
spring.cloud.config.server.git.username=${GITHUB_USERNAME:}
spring.cloud.config.server.git.password=${GITHUB_TOKEN:}
spring.cloud.config.server.git.skip-ssl-validation=${KARTYAVYA_CONFIG_REPO_SKIP_SSL_VALIDATION:false}

management.endpoints.web.exposure.include=${KARTYAVYA_ACTUATOR_EXPOSURE:health,info}
management.endpoint.health.show-details=${KARTYAVYA_HEALTH_SHOW_DETAILS:never}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
