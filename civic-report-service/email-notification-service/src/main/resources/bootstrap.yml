spring:
  application:
    name: email-notification-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  cloud:
    config:
      fail-fast: false
      retry:
        initial-interval: 2000
        max-attempts: 5
        multiplier: 1.5
        max-interval: 10000