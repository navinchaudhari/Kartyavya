spring.application.name=api-gateway
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

security.jwt.secret=s1dqwkU6SrfuOeNrssceAKlopDsLoJLMLadhq51w4Li
security.jwt.expiry-minutes=60

# ===================================================================
# Spring Cloud Gateway Routing Configuration
# ===================================================================

# Route 0: Maps to your Access Admin Service (Port 8081)
spring.cloud.gateway.routes[0].id=access-admin-service
spring.cloud.gateway.routes[0].uri=lb://access-admin-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**, /api/v1/admin/**

# Route 1: Maps to your AI Analytics Service (Port 8083)
spring.cloud.gateway.routes[1].id=ai-analytics-service
spring.cloud.gateway.routes[1].uri=lb://ai-analytics-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/analytics/**

# Route 2: Maps to Civic Report Service (Port 8082)
spring.cloud.gateway.routes[2].id=civic-report-service
spring.cloud.gateway.routes[2].uri=lb://civic-report-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/reports/**

# Enable dynamic discovery-based routing as a fallback mechanism
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux=true